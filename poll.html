<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkpoint — live responses</title>
<style>
:root{--primary:#4c4ddb;--primary-deep:#3a37b8;--primary-subdued:#dcdbfb;--ink:#16283f;--ink-secondary:#2c3f57;--ink-mute:#5f7189;--canvas:#fff;--canvas-soft:#f5f8fb;--canvas-cream:#f4ecdd;--hairline:#e5e7ef;--lemon:#946a28;--positive:#2f8f6a;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;padding:22px 24px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--hairline);padding-bottom:12px}
.n{font-family:var(--mono);font-size:34px;font-weight:400;line-height:1;color:var(--ink);font-feature-settings:'tnum' 1}
.n span{font-size:20px;color:var(--ink-mute);margin-left:8px}
.sec{font-family:var(--mono);font-size:17px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-mute);text-align:right;white-space:nowrap}
.bars{flex:1;min-height:0;display:flex;flex-direction:column;gap:11px;justify-content:center}
.row{display:grid;grid-template-columns:52px 1fr 60px;gap:14px;align-items:center}
.key{font-family:var(--mono);font-size:23px;color:var(--ink-mute);text-align:right;font-feature-settings:'tnum' 1}
.track{height:30px;background:var(--canvas-soft);border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--primary-subdued);border-radius:6px;transition:width .35s ease}
.cnt{font-family:var(--mono);font-size:21px;color:var(--ink-mute);font-feature-settings:'tnum' 1}
.row.hit .key{color:var(--primary-deep)}
.row.hit .fill{background:var(--primary)}
.row.hit .cnt{color:var(--primary-deep)}
.msg{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.msg .l1{font-size:24px;font-weight:300;color:var(--ink-mute)}
.msg .l2{font-size:19px;line-height:1.4;color:var(--ink-mute);max-width:420px}
.band{font-family:var(--mono);font-size:17px;color:var(--primary-deep);background:var(--primary-subdued);border-radius:6px;padding:8px 12px;text-align:center}
.hint{font-family:var(--mono);font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-mute);text-align:center;opacity:.75}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="n" id="n">–<span>responded</span></div><div class="sec" id="sec"></div></div>
<div class="bars" id="bars" hidden></div>
<div class="msg" id="msg"><div class="l1" id="msg1">waiting for responses…</div><div class="l2" id="msg2" hidden></div></div>
<div class="band" id="band" hidden></div>
<div class="hint" id="hint" hidden>click to reveal</div>
</div>

<script>
(function () {
'use strict';
var API_DEFAULT = 'https://script.google.com/macros/s/AKfycbwA6forNhaVMDWfjSKXdfDSuaE22YIo8lKwZMS4OgHVmqpSXvkyIFPrqQx5WzLXV04N/exec';
var qp = new URLSearchParams(location.search);
var QID = (qp.get('q') || '').trim();
var SEC = (qp.get('s') || '2026S1-A').trim();
var API = qp.get('api') || API_DEFAULT;
var INTERVAL = 2000, FAIL_AFTER = 10000;
var $ = function (id) { return document.getElementById(id); };

$('sec').textContent = SEC.replace(/^(\d{4})S(\d)-([AB])$/, 'Section $3 · $1S$2') || SEC;

/* ---------- state ---------- */
var cfg = null, counts = null, n = 0, revealed = false;
var active = false, timer = null, everGotData = false, firstFailAt = 0, sawParent = false, flushed = false;

/* ---------- JSONP (Apps Script drops CORS on its redirect hop) ---------- */
var seq = 0;
function jsonp(params, ok, fail) {
  var name = '__pcb' + (++seq) + '_' + Date.now(), s = document.createElement('script'), done = false;
  var t = setTimeout(function () { end(null); }, 8000);
  function end(d) {
    if (done) return; done = true; clearTimeout(t);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
    if (d) ok(d); else if (fail) fail();
  }
  window[name] = function (d) { end(d || {}); };
  s.onerror = function () { end(null); };
  s.src = API + (API.indexOf('?') < 0 ? '?' : '&') + params + '&callback=' + name;
  document.head.appendChild(s);
}

/* ---------- grading · §4 of the build package ---------- */
function isCorrect(given, c) {
  if (!c) return false;
  if (c.type === 'select') return String(given).trim().toUpperCase() === String(c.correct).trim().toUpperCase();
  var g = parseFloat(given), cc = parseFloat(c.correct), t = parseFloat(c.tolerance);
  if (isNaN(g)) return false;
  switch (c.mode) {
    case 'abs':    return Math.abs(g - cc) <= t;
    case 'absval': return Math.abs(Math.abs(g) - Math.abs(cc)) <= t * Math.abs(cc);
    default:       return Math.abs(g - cc) <= t * Math.abs(cc);
  }
}
function bandText(c) {
  if (!c || c.type === 'select') return 'correct answer · ' + String(c && c.correct);
  var cc = parseFloat(c.correct), t = parseFloat(c.tolerance);
  var fmt = function (x) { return (Math.round(x * 1000) / 1000).toString(); };
  if (c.mode === 'abs')    return 'accepted · ' + fmt(cc - t) + ' to ' + fmt(cc + t) + '  (±' + fmt(t) + ' absolute)';
  if (c.mode === 'absval') return 'accepted · magnitude ' + fmt(Math.abs(cc) - t * Math.abs(cc)) + ' to ' + fmt(Math.abs(cc) + t * Math.abs(cc)) + '  (sign ignored)';
  return 'accepted · ' + fmt(cc - t * Math.abs(cc)) + ' to ' + fmt(cc + t * Math.abs(cc)) + '  (±' + fmt(t * 100) + ' %)';
}

/* ---------- render ---------- */
function fail(hard) {
  $('bars').hidden = true; $('msg').hidden = false;
  $('msg1').textContent = hard ? 'poll unavailable' : 'waiting for responses…';
  $('msg2').hidden = !hard;
  if (hard) $('msg2').textContent = 'answers are still being recorded';
  $('n').innerHTML = (everGotData ? n : '–') + '<span>responded</span>';
}
function render() {
  $('n').innerHTML = n + '<span>responded</span>';
  var keys = Object.keys(counts || {});
  if (!keys.length) { fail(false); $('hint').hidden = true; return; }
  $('msg').hidden = true; $('bars').hidden = false;
  var rows;
  if (cfg && cfg.type === 'select') {
    rows = ['A', 'B', 'C', 'D'].map(function (k) { return [k, counts[k] || 0]; });
    keys.forEach(function (k) { if (['A','B','C','D'].indexOf(String(k).toUpperCase()) < 0) rows.push([k, counts[k]]); });
  } else {
    rows = keys.map(function (k) { return [k, counts[k]]; });
    rows.sort(function (a, b) {
      var x = parseFloat(a[0]), y = parseFloat(b[0]);
      if (isNaN(x) || isNaN(y)) return b[1] - a[1];
      return x - y;
    });
    if (rows.length > 9) {
      var byCount = rows.slice().sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
      var keep = {}; byCount.forEach(function (r) { keep[r[0]] = 1; });
      var other = 0; rows.forEach(function (r) { if (!keep[r[0]]) other += r[1]; });
      rows = rows.filter(function (r) { return keep[r[0]]; });
      if (other) rows.push(['other', other]);
    }
  }
  var max = 1; rows.forEach(function (r) { if (r[1] > max) max = r[1]; });
  var html = '';
  rows.forEach(function (r) {
    var hit = revealed && r[0] !== 'other' && isCorrect(r[0], cfg);
    html += '<div class="row' + (hit ? ' hit' : '') + '"><div class="key">' + String(r[0]).replace(/[<>&]/g, '') +
            '</div><div class="track"><div class="fill" style="width:' + Math.round(100 * r[1] / max) + '%"></div></div>' +
            '<div class="cnt">' + r[1] + '</div></div>';
  });
  $('bars').innerHTML = html;
  $('band').hidden = !(revealed && cfg);
  if (revealed && cfg) $('band').textContent = bandText(cfg);
  $('hint').hidden = revealed || !n;
}

/* ---------- polling ---------- */
function poll() {
  jsonp('qid=' + encodeURIComponent(QID) + '&section=' + encodeURIComponent(SEC), function (d) {
    if (d && typeof d.n === 'number') {
      everGotData = true; firstFailAt = 0;
      n = d.n; counts = d.counts || {};
      render();
    } else { onFail(); }
  }, onFail);
}
function onFail() {
  if (!firstFailAt) firstFailAt = Date.now();
  if (everGotData) { render(); return; }
  fail(Date.now() - firstFailAt >= FAIL_AFTER);
}
function setActive(on) {
  if (on === active) return;
  active = on;
  if (on) {
    if (!timer) { poll(); timer = setInterval(poll, INTERVAL); }
  } else {
    if (timer) { clearInterval(timer); timer = null; }
    /* advancing past a checkpoint is what commits its data */
    if (everGotData && n > 0) doFlush();
  }
}
function doFlush() {
  if (flushed) return; flushed = true;
  jsonp('action=flush&qid=' + encodeURIComponent(QID) + '&section=' + encodeURIComponent(SEC), function () {}, function () {});
}
function reveal() {
  if (revealed) return;
  revealed = true;
  render();
  doFlush();
}

/* the deck drives this; a click on the panel also works */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type !== 'uo.poll') return;
  sawParent = true;
  if (typeof d.active === 'boolean') setActive(d.active);
  if (d.reveal) reveal(); else if (d.reveal === false && d.resetReveal) { revealed = false; flushed = false; render(); }
}, false);

document.addEventListener('click', reveal);
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') reveal(); });

/* standalone / messaging-failure fallback: if no deck ever speaks to us, poll anyway */
setTimeout(function () { if (!sawParent) setActive(true); }, 2500);

if (!QID) { $('msg1').textContent = 'no question code'; $('msg2').hidden = false; $('msg2').textContent = 'this panel needs ?q=<qid> in its address'; }
else jsonp('action=config&qid=' + encodeURIComponent(QID), function (d) { cfg = (d && !d.error) ? d : null; if (counts) render(); }, function () {});
})();
</script>
</body>
</html>
