<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkpoint — live responses</title>
<style>
:root{--primary:#4c4ddb;--primary-deep:#3a37b8;--primary-subdued:#dcdbfb;--ink:#16283f;--ink-secondary:#2c3f57;--ink-mute:#5f7189;--canvas:#fff;--canvas-soft:#f5f8fb;--canvas-cream:#f4ecdd;--hairline:#e5e7ef;--lemon:#946a28;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:20px 22px 14px}
.top{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--hairline);padding-bottom:12px}
.timer{display:flex;align-items:baseline;gap:8px;padding:7px 14px;border-radius:9px;background:var(--canvas-soft);border:1px solid var(--hairline);flex:0 0 auto}
.timer b{font-family:var(--mono);font-size:18px;font-weight:400;line-height:1;color:var(--ink-mute);font-feature-settings:'tnum' 1}
.timer i{font-style:normal;font-family:var(--mono);font-size:14px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-mute)}
.timer.shut{background:var(--canvas-soft);border-color:var(--hairline)}
.timer.shut b{font-size:20px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-mute)}
.n{font-family:var(--mono);font-size:48px;font-weight:400;line-height:1;font-feature-settings:'tnum' 1;flex:0 0 auto}
.n i{font-style:normal;font-size:19px;color:var(--ink-mute);margin-left:9px}
.sec{margin-left:auto;font-family:var(--mono);font-size:15px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-mute);text-align:right;line-height:1.3}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hold{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;height:100%}
.hold .l1{font-family:var(--mono);font-size:17px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-mute);opacity:.8}
.hold .l2{font-size:16px;line-height:1.4;color:var(--ink-mute);max-width:380px}
.row{display:grid;grid-template-columns:48px 1fr 54px;gap:12px;align-items:center}
.key{font-family:var(--mono);font-size:21px;color:var(--ink-mute);text-align:right;font-feature-settings:'tnum' 1}
.track{height:26px;background:var(--canvas-soft);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--primary-subdued);border-radius:6px;transition:width .35s ease}
.cnt{font-family:var(--mono);font-size:19px;color:var(--ink-mute);font-feature-settings:'tnum' 1}
.row.hit .key,.row.hit .cnt{color:var(--primary-deep)}
.row.hit .fill{background:var(--primary)}
.band{font-family:var(--mono);font-size:16px;color:var(--primary-deep);background:var(--primary-subdued);border-radius:6px;padding:7px 11px;text-align:center}
.foot{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ctl{font-family:var(--mono);font-size:17px;letter-spacing:1.4px;text-transform:uppercase;color:#fff;background:var(--primary);border:1px solid var(--primary);border-radius:8px;padding:13px 30px;cursor:pointer}
.ctl:hover{background:var(--primary-deep);border-color:var(--primary-deep)}
.ctl[disabled]{opacity:.35;cursor:default}
.msg{margin-left:auto;font-size:15px;color:var(--ink-mute);text-align:right}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="n" id="n">0<i>responded</i></div>
<div class="timer" id="timer"><b id="tv">0:00</b></div>
<div class="sec" id="sec"></div>
</div>
<div class="body">
<div class="hold" id="hold"><div class="l1" id="hold1">results when closed</div><div class="l2" id="hold2">Answers are being counted. The distribution and the correct answer appear when you close the question.</div></div>
<div id="bars" hidden></div>
<div class="band" id="band" hidden></div>
</div>
<div class="foot">
<button class="ctl" id="shut">Close</button>
<div class="msg" id="msg"></div>
</div>
</div>

<script>
(function () {
'use strict';
var API_DEFAULT = 'https://script.google.com/macros/s/AKfycbwA6forNhaVMDWfjSKXdfDSuaE22YIo8lKwZMS4OgHVmqpSXvkyIFPrqQx5WzLXV04N/exec';
var TERM = '2026S1';
var qp = new URLSearchParams(location.search);
var QID = (qp.get('q') || '').trim();
var RAW = (qp.get('s') || 'A').trim();
var SEC = /^[AB]$/i.test(RAW) ? TERM + '-' + RAW.toUpperCase() : RAW;
var API = qp.get('api') || API_DEFAULT;
var INTERVAL = 2000, FAIL_AFTER = 10000;
var $ = function (id) { return document.getElementById(id); };
$('sec').textContent = SEC.replace(/^(\d{4})S(\d)-([AB])$/, 'Section $3 · $1S$2');

var cfg = null, counts = null, n = 0;
var revealed = false, opened = false, closedSent = false, flushed = false;
var startedAt = 0, tick = null, timer = null, active = false;
var everData = false, firstFail = 0, sawParent = false;

var seq = 0;
function jsonp(params, ok, fail) {
  var name = '__pcb' + (++seq) + '_' + Date.now(), s = document.createElement('script'), done = false;
  var t = setTimeout(function () { end(null); }, 8000);
  function end(d) {
    if (done) return; done = true; clearTimeout(t);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
    if (d) ok(d); else if (fail) fail();
  }
  window[name] = function (d) { end(d || {}); };
  s.onerror = function () { end(null); };
  s.src = API + (API.indexOf('?') < 0 ? '?' : '&') + params + '&callback=' + name;
  document.head.appendChild(s);
}
var q = function () { return 'section=' + encodeURIComponent(SEC) + '&qid=' + encodeURIComponent(QID); };

/* ---------- grading · §4 of the build package ---------- */
function isCorrect(given, c) {
  if (!c) return false;
  if (c.type === 'select') return String(given).trim().toUpperCase() === String(c.correct).trim().toUpperCase();
  var g = parseFloat(given), cc = parseFloat(c.correct), t = parseFloat(c.tolerance);
  if (isNaN(g)) return false;
  switch (c.mode) {
    case 'abs':    return Math.abs(g - cc) <= t;
    case 'absval': return Math.abs(Math.abs(g) - Math.abs(cc)) <= t * Math.abs(cc);
    default:       return Math.abs(g - cc) <= t * Math.abs(cc);
  }
}
function bandText(c) {
  if (!c) return '';
  if (c.type === 'select') return 'correct answer · ' + String(c.correct);
  var cc = parseFloat(c.correct), t = parseFloat(c.tolerance), f = function (x) { return (Math.round(x * 1000) / 1000).toString(); };
  if (c.mode === 'abs')    return 'accepted · ' + f(cc - t) + ' to ' + f(cc + t) + '  (±' + f(t) + ')';
  if (c.mode === 'absval') return 'accepted · magnitude ' + f(Math.abs(cc) * (1 - t)) + ' to ' + f(Math.abs(cc) * (1 + t)) + '  (sign ignored)';
  return 'accepted · ' + f(cc - t * Math.abs(cc)) + ' to ' + f(cc + t * Math.abs(cc)) + '  (±' + f(t * 100) + ' %)';
}

/* ---------- elapsed · v3 ---------- */
/* This counts UP and closes nothing. It exists so the lecturer can see how long
   a checkpoint has been running; the cue to close is the response count going
   flat, not this number. Kept deliberately small and muted — it must not read
   as a clock from the back of the room. */
function paintTimer() {
  if (revealed) { $('timer').className = 'timer shut'; $('tv').textContent = 'closed'; return; }
  var e = Math.max(0, Math.round((Date.now() - startedAt) / 1000));
  $('tv').textContent = Math.floor(e / 60) + ':' + ('0' + (e % 60)).slice(-2);
  $('timer').className = 'timer';
}
function startTimer() {
  startedAt = Date.now();
  if (tick) clearInterval(tick);
  tick = setInterval(paintTimer, 1000);
  paintTimer();
}
function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

/* v3 · the lecturer closes: close, stop polling, reveal everything.
   Nothing else calls this — there is no expiry. */
function closeNow() {
  if (revealed) return;
  stopTimer();
  revealed = true;
  poll(function () { render(); });          /* one last count, then show it */
  if (timer) { clearInterval(timer); timer = null; }
  if (!closedSent) { closedSent = true; jsonp('action=close&' + q(), function () {}, function () {}); }
  doFlush();
  paintTimer();
  render();
  $('shut').disabled = true;
  try { parent.postMessage({ type: 'uo.reveal', qid: QID }, '*'); } catch (e) {}
}
function doFlush() { if (flushed) return; flushed = true; jsonp('action=flush&' + q(), function () {}, function () {}); }

/* ---------- render ---------- */
function render() {
  $('n').innerHTML = (everData ? n : 0) + '<i>responded</i>';
  /* B8 · no bars while the question is live */
  if (!revealed) {
    $('bars').hidden = true; $('band').hidden = true; $('hold').hidden = false;
    if (!everData && firstFail && Date.now() - firstFail >= FAIL_AFTER) {
      $('hold1').textContent = 'poll unavailable';
      $('hold2').textContent = 'answers are still being recorded';
    } else if (!everData) {
      $('hold1').textContent = 'waiting for responses…';
      $('hold2').textContent = 'The distribution and the correct answer appear when you close the question.';
    } else {
      $('hold1').textContent = 'results when closed';
      $('hold2').textContent = 'Answers are being counted. The distribution and the correct answer appear when you close the question.';
    }
    return;
  }
  $('hold').hidden = true;
  var keys = Object.keys(counts || {});
  if (!keys.length) {
    $('bars').hidden = true; $('hold').hidden = false;
    $('hold1').textContent = 'no responses'; $('hold2').textContent = 'Nobody answered before the question was closed.';
    $('band').hidden = !cfg; if (cfg) $('band').textContent = bandText(cfg);
    return;
  }
  var rows;
  if (cfg && cfg.type === 'select') {
    rows = ['A', 'B', 'C', 'D'].map(function (k) { return [k, counts[k] || 0]; });
    keys.forEach(function (k) { if (['A','B','C','D'].indexOf(String(k).toUpperCase()) < 0) rows.push([k, counts[k]]); });
  } else {
    rows = keys.map(function (k) { return [k, counts[k]]; });
    rows.sort(function (a, b) { var x = parseFloat(a[0]), y = parseFloat(b[0]); return (isNaN(x) || isNaN(y)) ? b[1] - a[1] : x - y; });
    if (rows.length > 8) {
      var top = rows.slice().sort(function (a, b) { return b[1] - a[1]; }).slice(0, 7), keep = {};
      top.forEach(function (r) { keep[r[0]] = 1; });
      var other = 0; rows.forEach(function (r) { if (!keep[r[0]]) other += r[1]; });
      rows = rows.filter(function (r) { return keep[r[0]]; });
      if (other) rows.push(['other', other]);
    }
  }
  var max = 1; rows.forEach(function (r) { if (r[1] > max) max = r[1]; });
  var html = '';
  rows.forEach(function (r) {
    var hit = r[0] !== 'other' && isCorrect(r[0], cfg);
    html += '<div class="row' + (hit ? ' hit' : '') + '"><div class="key">' + String(r[0]).replace(/[<>&]/g, '') +
            '</div><div class="track"><div class="fill" style="width:' + Math.round(100 * r[1] / max) + '%"></div></div><div class="cnt">' + r[1] + '</div></div>';
  });
  $('bars').innerHTML = html;
  $('bars').hidden = false;
  $('bars').style.display = 'flex';
  $('bars').style.flexDirection = 'column';
  $('bars').style.gap = '9px';
  $('band').hidden = !cfg;
  if (cfg) $('band').textContent = bandText(cfg);
}

/* ---------- polling ---------- */
function poll(after) {
  jsonp(q(), function (d) {
    if (d && typeof d.n === 'number') { everData = true; firstFail = 0; n = d.n; counts = d.counts || {}; }
    else if (!firstFail) firstFail = Date.now();
    render(); if (after) after();
  }, function () { if (!firstFail) firstFail = Date.now(); render(); if (after) after(); });
}
function openQuestion() {
  jsonp('action=open&' + q(), function () {
    opened = true;
    startTimer();
    $('msg').textContent = '';
  }, function () {
    opened = true;
    startTimer();
    $('msg').textContent = 'opened locally — server did not answer';
  });
}
function setActive(on) {
  if (on === active) return;
  active = on;
  if (on) {
    if (revealed) { paintTimer(); render(); return; }
    /* re-entering a checkpoint restarts it (spec C8) */
    closedSent = false; flushed = false;
    if (!timer) { poll(); timer = setInterval(poll, INTERVAL); }
    openQuestion();
  } else {
    if (timer) { clearInterval(timer); timer = null; }
    stopTimer();
    if (everData && n > 0) doFlush();
  }
}

/* ---------- the only control · v3 ---------- */
$('shut').onclick = function () { if (revealed) return; closeNow(); };

window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object' || d.type !== 'uo.poll') return;
  sawParent = true;
  if (typeof d.active === 'boolean') setActive(d.active);
  if (d.reveal && !revealed) { closeNow(); }   /* reveal driven from the deck */
}, false);

setTimeout(function () { if (!sawParent) setActive(true); }, 2500);

if (!QID) { $('hold1').textContent = 'no question code'; $('hold2').textContent = 'this panel needs ?q=<qid> in its address'; $('timer').hidden = true; }
else jsonp('action=config&qid=' + encodeURIComponent(QID), function (d) { cfg = (d && !d.error) ? d : null; render(); }, function () {});
render();
})();
</script>
</body>
</html>
